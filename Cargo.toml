[package]
name = "tesseract-55-rs"
version = "0.2.1"
edition = "2021"
authors = [
    "Cafer Can Gündoğdu <cafercangundogdu@gmail.com>",
    "Dario Finardi <d.finardi@semplifica.ai>",
]
description = "Safe Rust bindings for Tesseract OCR 5.5 with built-in compilation of Tesseract + Leptonica. Exposes full word-level hierarchy (block/paragraph/line/word) with bounding boxes."
license = "MIT"
repository = "https://github.com/dariofinardi/tesseract-rs"
homepage = "https://github.com/dariofinardi/tesseract-rs"
documentation = "https://docs.rs/tesseract-55-rs"
readme = "README.md"
keywords = [
    "tesseract",
    "ocr",
    "text-recognition",
    "bounding-box",
    "document",
]
categories = ["external-ffi-bindings", "computer-vision", "text-processing"]
build = "build.rs"
links = "tesseract"
rust-version = "1.83.0"
exclude = ["tessdata/*", "third_party/*"]

[dependencies]
libc = "0.2.174"
thiserror = "1.0.69"
# Serde per derivazione Serialize/Deserialize dei tipi `hierarchy.rs`
# (BoundingBox, TesseractWord/TextLine/Paragraph/Block/Hierarchy).
# Necessario per consumer che salvano l'OCR su disco (sidecar JSON,
# audit log) o lo trasportano via IPC (Tauri commands → frontend JSON).
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
image = "0.25.6"
imageproc = "0.25.0"
criterion = { version = "0.7.0", features = ["html_reports"] }
# JSON serialization per i test di hierarchy (round-trip serde)
serde_json = "1"

[build-dependencies]
cc = { version = "1.2.30", optional = true }
glob = { version = "0.3.2", optional = true }
cmake = { version = "0.1.54", optional = true }
reqwest = { version = "0.12.22", features = ["blocking"], optional = true }
zip = { version = "2.4.2", optional = true }


[features]
default = ["build-tesseract"]
build-tesseract = ["cc", "glob", "cmake", "reqwest", "zip"]
# Builda Leptonica + Tesseract come DLL (Win) / .so / .dylib invece
# di static lib. Utile per app desktop (Tauri ecc.) che vogliono
# spedire le dipendenze native come file separati nel bundle, non
# inglobate nell'eseguibile. Default OFF: il caso standard e' single
# rlib self-contained.
dynamic-libs = []

[package.metadata.docs.rs]
features = ["docs-only"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "tesseract_rs"
crate-type = ["lib"]

[[bench]]
name = "ocr_benchmark"
harness = false
